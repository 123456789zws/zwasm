name: Build zwasm

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # 手动触发

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.16.0
      
      - name: Build static-lib
        run: zig build static-lib -Dgc=true -Dengine=interp -O ReleaseSmall
      
      - name: Build CLI
        run: zig build -Dgc=true -Dengine=interp -O ReleaseSmall
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zwasm-windows
          path: |
            zig-out/lib/*.lib
            zig-out/bin/*.exe
            include/

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.16.0
      
      - name: Build static-lib
        run: zig build static-lib -Dgc=true -Dengine=interp -O ReleaseSmall
      
      - name: Build CLI
        run: zig build -Dgc=true -Dengine=interp -O ReleaseSmall
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zwasm-linux
          path: |
            zig-out/lib/*.a
            zig-out/bin/zwasm
            include/
