name: Build zwasm static-lib

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.16.0
      
      - name: Build static-lib
        run: zig build static-lib -Dgc=true -Dengine=interp -Doptimize=ReleaseSmall
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zwasm-windows-static-lib
          path: |
            zig-out/lib/
            include/

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.16.0
      
      - name: Build static-lib
        run: zig build static-lib -Dgc=true -Dengine=interp -Doptimize=ReleaseSmall
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zwasm-linux-static-lib
          path: |
            zig-out/lib/
            include/
